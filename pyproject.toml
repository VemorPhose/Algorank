[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "algorank-v2"
version = "0.1.0"
description = "Backend-first competitive programming contest platform built with FastAPI, PostgreSQL, Redis, Judge0, and Nginx."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "alembic>=1.13,<2",
    "asyncpg>=0.29,<1",
    "email-validator>=2.1,<3",
    "fastapi>=0.111,<1",
    "httpx>=0.27,<1",
    "bcrypt>=3.2,<4",
    "passlib[bcrypt]>=1.7,<2",
    "psycopg2-binary>=2.9,<3",
    "pydantic-settings>=2.2,<3",
    "python-jose[cryptography]>=3.3,<4",
    "python-multipart>=0.0.9,<1",
    "redis>=5,<6",
    "SQLAlchemy[asyncio]>=2.0,<3",
    "structlog>=24,<26",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "aiosqlite>=0.20,<1",
    "pytest>=8,<9",
    "pytest-asyncio>=0.23,<1",
    "pytest-cov>=5,<7",
    "ruff>=0.5,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore:'crypt' is deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["B008", "E501"]
